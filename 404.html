<!DOCTYPE html>
<html lang="id" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 Not Found | Notes</title>
<style>
:root{--bg:#f2f2f7;--paper:#fff;--ink:#1c1c1e;--line:#e4e4ea;--muted:#8a8a8e;--acc:#c9a100}
[data-theme=black]{--bg:#000;--paper:#1c1c1e;--ink:#f2f2f7;--line:#2f2f33;--muted:#8e8e93;--acc:#ffd84d}
[data-theme=green]{--bg:#d9ecdf;--paper:#f3fbf5;--ink:#1d3b2a;--line:#cbe4d2;--muted:#5d8a6e;--acc:#2f9a5f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
.card{width:100%;max-width:360px;background:var(--paper);border-radius:8px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.22);transform:rotate(-1.5deg)}
.tab{height:28px;background:#ffd84d;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:11px;color:rgba(0,0,0,.6)}
.pg{padding:0 18px 20px;line-height:24px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 23px,var(--line) 23px,var(--line) 24px)}
h1{margin:0;font-size:64px;line-height:96px;color:var(--acc)}
h2{margin:0;font-size:20px;line-height:24px}
p{margin:0;color:var(--muted);font-size:14px}
code{background:var(--line);border-radius:4px;padding:1px 5px;font-size:13px;color:var(--ink)}
a.btn{display:inline-block;margin-top:24px;background:var(--acc);color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-size:14px}
a.t{color:var(--acc)}
</style>
</head>
<body>
<div class="card">
  <div class="tab"><span>Notes</span><span>HTTP 404</span></div>
  <div class="pg">
    <h1>404</h1>
    <h2>Not Found</h2>
    <p>Halaman atau note yang kamu cari tidak ada. Mungkin salah alamat, atau note-nya sudah dihapus.</p>
    <p>Untuk AI agent: endpoint tidak valid atau <code>id</code> tidak ditemukan. Baca <a class="t" href="/AGENT.md">/AGENT.md</a>.</p>
    <a class="btn" href="/">Kembali ke Notes</a>
  </div>
</div>
<script>try{var t=localStorage.theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</body>
</html>
